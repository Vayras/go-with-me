# go-with-me hub — friendly tmux settings (only affects the hub, not your other tmux sessions)

# Hub prefix is Ctrl+a, so Ctrl+b still reaches the device sessions inside each tab
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on                 # click tabs, click panes, scroll with the mouse
set -g escape-time 10
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g base-index 0
setw -g automatic-rename off
set -g allow-rename off

# Switch tabs without any prefix: Alt+0..9, Alt+←/→  (Terminal.app: Settings → Profiles → Keyboard → "Use Option as Meta key")
bind -n M-0 select-window -t :0
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-Left  previous-window
bind -n M-Right next-window
# Alt+↑/↓ moves between the status board and the coordinator
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Look
set -g status-position top
set -g status-style "bg=colour236,fg=colour250"
set -g status-left "#[bold,fg=colour235,bg=colour214] go-with-me #[default] "
set -g status-left-length 30
set -g status-right "#[fg=colour244]click a tab · Alt+0-9 · Ctrl+a d = leave (all keeps running) "
set -g status-right-length 80
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bold,fg=colour235,bg=colour110] #I #W "
setw -g pane-border-status top
setw -g pane-border-format "#{?#{==:#{window_name},overview},#{?#{==:#{pane_index},0}, STATUS BOARD ,  COORDINATOR — ask about or delegate to any device },}"
set -g pane-active-border-style "fg=colour214"
