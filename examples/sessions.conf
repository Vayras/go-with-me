# go-with-me sessions — each one becomes a tab, and keeps running on its host.
#   name | host | engine | account | folder
#
#   engine   claude    Claude Code
#            opencode  opencode (uses local models via Ollama — set up with: gwm opencode-setup --on <host>)
#            shell     a plain terminal
#   account  which Claude login to use: default (the host's normal login) or any label, e.g. personal / work.
#            Each label is a separate sign-in:  gwm login work --on studio
#            (ignored for opencode/shell — use - )
#   folder   where the session starts (default ~)

studio         | studio  | claude   | personal | ~
studio-work    | studio  | claude   | work     | ~/work
studio-local   | studio  | opencode | -        | ~
macbook        | macbook | claude   | work     | ~
# sandbox      | sandbox | claude   | default  | ~
