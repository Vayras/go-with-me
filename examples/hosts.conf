# go-with-me hosts — the machines (and VMs) you can run sessions on.
#   name | ssh target | role
#
#   name        short name (letters, digits, -)
#   ssh target  user@host — use Tailscale names (e.g. you@my-studio) so it works from anywhere.
#               Lima VMs are written vm:<parent-host>/<vm-name>  (gwm vm create adds these for you)
#   role        free text; the coordinator reads it to decide where work should go
#
# The machine you run gwm on is detected via `gwm init <name>`, so it doesn't need SSH to itself.

studio  | you@my-mac-studio  | Home Mac Studio, 64GB. Always on. Local models (Ollama), VMs, heavy jobs.
macbook | you@my-macbook-pro | Work MacBook Pro. Daily driver; may be asleep or away.
# office1 | you@office-studio-1 | Office Mac Studio, 128GB. Big models, video/image generation.
# sandbox | vm:studio/sandbox  | Linux VM on studio for risky/experimental work
